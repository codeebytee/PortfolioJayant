<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post | Jayant Singh</title>
<meta name="author" content="Jayant Singh">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="blog.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-chrome">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="topbar-path" id="topbarPath">jayant@portfolio: ~/site/blog</div>
  </div>
  <nav class="nav-row" aria-label="Site">
    <span class="prompt">~$</span>
    <a class="nav-a" href="../index.html">./home</a>
    <a class="nav-a current" href="index.html">./blog</a>
    <a class="nav-a" href="../index.html#contact">./contact</a>
  </nav>
</header>

<main class="section">
  <article>
    <header class="post-header" id="postHeader" hidden>
      <div class="post-date" id="postDate"></div>
      <h1 id="postTitle"></h1>
    </header>

    <div id="postStatus" class="status" role="status">
      <span class="status-head">$ cat post.md</span>
      Loading this post from GitHub.
    </div>

    <div class="post-body" id="postBody" hidden></div>
  </article>

  <footer class="post-footer">
    <a href="index.html">← All posts</a>
  </footer>
</main>

<script src="blog.js"></script>
<script>
(function () {
  "use strict";

  var statusEl = document.getElementById('postStatus');
  var headerEl = document.getElementById('postHeader');
  var titleEl = document.getElementById('postTitle');
  var dateEl = document.getElementById('postDate');
  var bodyEl = document.getElementById('postBody');

  function showError(message) {
    headerEl.hidden = true;
    bodyEl.hidden = true;
    statusEl.hidden = false;
    statusEl.className = 'status error';
    statusEl.innerHTML = '<span class="status-head">$ error</span>' + Blog.esc(message);
  }

  function renderMarkdown(markdown) {
    if (global_marked()) {
      return global_marked().parse(markdown, { gfm: true, breaks: false });
    }
    // marked.js could not be loaded (offline, blocked CDN) — show the raw
    // Markdown rather than a blank page.
    return '<pre>' + Blog.esc(markdown) + '</pre>';
  }

  function global_marked() {
    return (typeof marked !== 'undefined') ? marked : null;
  }

  function render(post) {
    document.title = post.title + ' | Jayant Singh';
    document.getElementById('topbarPath').textContent =
      'jayant@portfolio: ~/site/blog/' + post.slug + '.md';

    titleEl.textContent = post.title;
    dateEl.textContent = Blog.formatDate(post.date);
    bodyEl.innerHTML = renderMarkdown(post.body);

    statusEl.hidden = true;
    headerEl.hidden = false;
    bodyEl.hidden = false;
  }

  var slug = new URLSearchParams(window.location.search).get('slug') || '';

  if (!slug) {
    showError('No post was requested. Head back to the blog index and pick a post.');
    return;
  }
  // Slugs are plain filenames — anything else is not a post in posts/.
  if (!/^[A-Za-z0-9._-]+$/.test(slug) || slug.indexOf('..') !== -1) {
    showError('That post link looks malformed.');
    return;
  }

  // marked is deferred, so wait for the page to finish loading before rendering.
  var ready = new Promise(function (resolve) {
    if (document.readyState === 'complete') resolve();
    else window.addEventListener('load', resolve);
  });

  Promise.all([Blog.loadPost(slug), ready]).then(function (results) {
    render(results[0]);
  }).catch(function (err) {
    showError(Blog.errorMessage(err));
  });
})();
</script>
</body>
</html>
